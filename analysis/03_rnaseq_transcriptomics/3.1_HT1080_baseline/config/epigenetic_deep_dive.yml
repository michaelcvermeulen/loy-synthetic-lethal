descriptive_masks: [original, omit_IFN_ECM_cycle, omit_nucleosome, omit_top_5, omit_top_10, retain_CPM_at_least_5]
nucleosome_reference: GOCC_NUCLEOSOME
gene_influence_rule: 'Rank each complete represented set by absolute combined log2 effect, then exact gene ID; freeze removals across contrasts. Recompute means on retained genes, retaining counts and absolute-effect fractions.'
readout_rule: 'For EED-only and mark-only partitions separately, retain mean CPM>=2, absolute combined effect>=0.5, same sign in both periods and all six leave-one-match-out estimates, and same sign under prior-count 0.25 and RLE sensitivity. Select up to three genes in each direction per partition by absolute combined effect then exact ID. Include oppositely responding genes; explicitly label post hoc. No selected readouts define any score or testing family.'
score_background: unchanged_25461_HT1080_representative_genes
score_rule: 'Per-sample count percentile ranks with average ties, 100*(rank-1)/(N-1); complete represented memberships, no leading-edge restriction. Paired signed scores exclude within-pair UP/DN conflicts from both arms.'
statistics: 'Reuse original 23696-set global BH separately by method and contrast. No new enrichment P values or smaller-family BH. New partitions, exclusions, gene influence and scores are descriptive; no gene-independent tests or intervals.'
replication: one_established_population_per_condition_shared_generation_history_repeated_passages
